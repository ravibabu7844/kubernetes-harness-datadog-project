apiVersion: v1
kind: Service
metadata:
  name: devops-app-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  selector:
    app: devops-app
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
